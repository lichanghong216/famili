<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#4caf50">
    <title>家庭饮食计划 · 共享版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f5f7f0;
            font-family: 'Segoe UI', Roboto, system-ui, 'Helvetica Neue', sans-serif;
            color: #2c3e2f;
            padding: 16px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #6b8c5c, #4caf50);
            padding: 24px 20px;
            color: white;
        }

        .app-header h1 {
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .custom-subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 8px;
            cursor: pointer;
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 40px;
            transition: 0.2s;
        }
        .custom-subtitle:hover {
            background: rgba(255,255,255,0.3);
        }
        .custom-subtitle.editing {
            background: white;
            color: #2c3e2f;
            padding: 4px 12px;
        }

        .toolbar {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e2e8e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .week-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .day-tab {
            background: #f0f3ec;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a6741;
        }

        .day-tab.active {
            background: #4caf50;
            color: white;
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.3);
        }

        .day-tab.today {
            border: 2px solid #4caf50;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-btn {
            background: #f0f3ec;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #4a6741;
        }

        .share-btn {
            background: #4caf50;
            color: white;
        }

        .import-btn {
            background: #2196f3;
            color: white;
        }

        .export-btn {
            background: #ff9800;
            color: white;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            min-height: 600px;
        }

        .plan-section {
            flex: 2;
            min-width: 280px;
            padding: 20px;
            background: #fefef9;
        }

        .meal-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .meal-card {
            background: white;
            border-radius: 24px;
            border: 1px solid #e5ecd9;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .meal-header {
            background: #f8faf2;
            padding: 14px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 2px solid #e2e8d5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meal-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dish-input-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 180px;
        }
        .dish-search-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 48px;
            border: 1px solid #d4dec9;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
        }
        .dish-search-input:focus {
            border-color: #4caf50;
        }
        .add-dish-btn {
            background: #4caf50;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .meal-content {
            padding: 16px;
        }

        .dishes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            min-height: 60px;
        }

        .dish-tag {
            background: #e8f0e2;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .remove-dish {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
        }

        .empty-meal {
            color: #bdc9ae;
            font-size: 0.8rem;
            font-style: italic;
        }

        /* 右侧菜品库 */
        .menu-library {
            width: 360px;
            background: #ffffff;
            border-left: 1px solid #e2e8e0;
            padding: 20px;
            position: sticky;
            top: 0;
            align-self: flex-start;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .library-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #3a5e32;
        }

        .add-custom-btn {
            background: #4caf50;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .category-filter {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .cat-filter-btn {
            background: #f0f3ec;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .cat-filter-btn.active {
            background: #4caf50;
            color: white;
        }

        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .dish-item {
            background: #fefcf5;
            border-radius: 40px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e9efdf;
        }

        .dish-name {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .dish-category-badge {
            font-size: 0.65rem;
            background: #e2e8d5;
            padding: 2px 8px;
            border-radius: 20px;
            color: #4a6741;
        }

        .dish-actions {
            display: flex;
            gap: 6px;
        }

        .delete-dish-btn {
            background: #ffe6e0;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #d9534f;
        }

        @media (max-width: 780px) {
            body { padding: 8px; }
            .main-content { flex-direction: column; }
            .menu-library { width: 100%; border-left: none; border-top: 1px solid #e2e8e0; max-height: 400px; }
            .meal-header { flex-direction: column; align-items: stretch; }
            .dish-input-container { width: 100%; }
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e2f;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .toast-msg.show { opacity: 1; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1><i class="fas fa-calendar-alt"></i> 家庭饮食计划 · 共享版</h1>
        <div id="customSubtitle" class="custom-subtitle">👩‍❤️‍👨 夫妻共享菜单 · 支持微信分享同步</div>
    </div>

    <div class="toolbar">
        <div class="week-tabs" id="weekTabs"></div>
        <div class="action-buttons">
            <button class="action-btn export-btn" id="exportDataBtn"><i class="fas fa-download"></i> 导出数据</button>
            <button class="action-btn import-btn" id="importDataBtn"><i class="fas fa-upload"></i> 导入数据</button>
            <button class="action-btn share-btn" id="sharePlanBtn"><i class="fas fa-share-alt"></i> 分享链接</button>
            <button class="action-btn" id="copyWeekBtn"><i class="fas fa-copy"></i> 复制到本周</button>
            <button class="action-btn" id="resetDayBtn"><i class="fas fa-undo-alt"></i> 重置当天</button>
        </div>
    </div>

    <div class="main-content">
        <div class="plan-section">
            <div id="mealPlanContainer" class="meal-grid"></div>
        </div>
        <div class="menu-library">
            <div class="library-header">
                <h3><i class="fas fa-utensils"></i> 菜品库</h3>
                <button class="add-custom-btn" id="addCustomDishBtn"><i class="fas fa-plus-circle"></i> 自定义菜</button>
            </div>
            <div class="category-filter" id="categoryFilter"></div>
            <div class="dish-list" id="dishList"></div>
            <div style="margin-top: 16px; font-size: 0.7rem; color: #a3b899; text-align: center;">
                <i class="fas fa-lightbulb"></i> 在搜索框输入菜名，按「添加」即可<br>
                <i class="fas fa-trash"></i> 可删除任意菜品（包括预设）
            </div>
        </div>
    </div>
    <input type="file" id="importFileInput" accept=".json" style="display: none;">
</div>
<div id="toastMsg" class="toast-msg"></div>

<script>
    // ---------- 预设菜品库（增加饮品分类）----------
    let DEFAULT_DISHES = [
        { id: "b1", name: "小米粥", category: "早餐", emoji: "🥣" },
        { id: "b2", name: "煮鸡蛋", category: "早餐", emoji: "🥚" },
        { id: "b3", name: "全麦面包", category: "早餐", emoji: "🍞" },
        { id: "b4", name: "牛奶燕麦", category: "早餐", emoji: "🥛" },
        { id: "b5", name: "煎蛋三明治", category: "早餐", emoji: "🥪" },
        { id: "b6", name: "豆浆油条", category: "早餐", emoji: "🥛🥖" },
        { id: "b7", name: "肉包子", category: "早餐", emoji: "🥟" },
        { id: "l1", name: "西红柿炒蛋", category: "家常菜", emoji: "🍅🥚" },
        { id: "l2", name: "红烧排骨", category: "硬菜", emoji: "🍖" },
        { id: "l3", name: "酸辣土豆丝", category: "素菜", emoji: "🥔" },
        { id: "l4", name: "蒜蓉西兰花", category: "素菜", emoji: "🥦" },
        { id: "l5", name: "清蒸鲈鱼", category: "海鲜", emoji: "🐟" },
        { id: "l6", name: "宫保鸡丁", category: "家常菜", emoji: "🍗" },
        { id: "l7", name: "麻婆豆腐", category: "家常菜", emoji: "🌶️" },
        { id: "l8", name: "红烧肉", category: "硬菜", emoji: "🥩" },
        { id: "l9", name: "蒜蓉空心菜", category: "素菜", emoji: "🥬" },
        { id: "l10", name: "玉米排骨汤", category: "汤类", emoji: "🌽" },
        { id: "l11", name: "紫菜蛋花汤", category: "汤类", emoji: "🥣" },
        { id: "l12", name: "蛋炒饭", category: "主食", emoji: "🍚" },
        { id: "l13", name: "白米饭", category: "主食", emoji: "🍚" },
        { id: "l14", name: "青椒肉丝", category: "家常菜", emoji: "🫑" },
        { id: "l15", name: "糖醋里脊", category: "硬菜", emoji: "🍖" },
        { id: "l16", name: "凉拌黄瓜", category: "凉菜", emoji: "🥒" },
        { id: "l17", name: "皮蛋豆腐", category: "凉菜", emoji: "🥚" },
        { id: "l18", name: "手撕包菜", category: "素菜", emoji: "🥬" },
        { id: "l19", name: "酸菜鱼", category: "海鲜", emoji: "🐟" },
        { id: "l20", name: "番茄牛腩", category: "硬菜", emoji: "🍅" },
        // 新增饮品分类
        { id: "dr1", name: "现磨咖啡", category: "饮品", emoji: "☕" },
        { id: "dr2", name: "鲜榨橙汁", category: "饮品", emoji: "🍊" },
        { id: "dr3", name: "冰柠檬茶", category: "饮品", emoji: "🍋" },
        { id: "dr4", name: "热牛奶", category: "饮品", emoji: "🥛" },
        { id: "dr5", name: "豆浆", category: "饮品", emoji: "🥛" },
        { id: "dr6", name: "可乐", category: "饮品", emoji: "🥤" },
        { id: "dr7", name: "雪碧", category: "饮品", emoji: "🥤" }
    ];

    const WEEKDAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    const MEALS = [
        { key: "breakfast", label: "🥐 早餐", icon: "fa-sun" },
        { key: "lunch", label: "🍱 午餐", icon: "fa-utensils" },
        { key: "dinner", label: "🌙 晚餐", icon: "fa-moon" }
    ];

    let mealPlan = {};
    let customDishes = [];
    let deletedDishIds = [];
    let dishLibrary = [];
    let currentDayIndex = 0;
    let currentCategoryFilter = "全部";
    let customSubtitle = "👩‍❤️‍👨 夫妻共享菜单 · 支持微信分享同步";

    // 获取当前星期几（0=周一, 6=周日）
    const getCurrentWeekdayIndex = () => {
        const date = new Date();
        const day = date.getDay();
        if (day === 0) return 6;
        return day - 1;
    };

    const initEmptyPlan = () => {
        const newPlan = {};
        WEEKDAYS.forEach(day => {
            newPlan[day] = { breakfast: [], lunch: [], dinner: [] };
        });
        return newPlan;
    };

    const rebuildDishLibrary = () => {
        const availableDefault = DEFAULT_DISHES.filter(dish => !deletedDishIds.includes(dish.id));
        dishLibrary = [...availableDefault, ...customDishes];
    };

    const loadData = () => {
        // 加载计划
        const storedPlan = localStorage.getItem("family_meal_plan_v3");
        if (storedPlan) {
            try {
                mealPlan = JSON.parse(storedPlan);
                WEEKDAYS.forEach(day => {
                    MEALS.forEach(meal => {
                        if (mealPlan[day] && !Array.isArray(mealPlan[day][meal.key])) {
                            mealPlan[day][meal.key] = [];
                        }
                    });
                });
            } catch(e) { mealPlan = initEmptyPlan(); }
        } else {
            mealPlan = initEmptyPlan();
        }
        
        // 加载自定义菜品
        const storedCustom = localStorage.getItem("family_custom_dishes_v3");
        if (storedCustom) {
            try {
                customDishes = JSON.parse(storedCustom);
            } catch(e) { customDishes = []; }
        }
        
        // 加载已删除菜品ID
        const storedDeleted = localStorage.getItem("family_deleted_dishes_v3");
        if (storedDeleted) {
            try {
                deletedDishIds = JSON.parse(storedDeleted);
            } catch(e) { deletedDishIds = []; }
        }
        
        // 加载自定义副标题
        const storedSubtitle = localStorage.getItem("family_custom_subtitle");
        if (storedSubtitle) {
            customSubtitle = storedSubtitle;
            const subtitleDiv = document.getElementById("customSubtitle");
            if (subtitleDiv) subtitleDiv.textContent = customSubtitle;
        }
        
        rebuildDishLibrary();
    };

    const savePlan = () => {
        localStorage.setItem("family_meal_plan_v3", JSON.stringify(mealPlan));
    };

    const saveCustomDishes = () => {
        localStorage.setItem("family_custom_dishes_v3", JSON.stringify(customDishes));
        rebuildDishLibrary();
        renderDishLibrary();
        renderCategoryFilter();
        renderCurrentDayPlan(); // 刷新输入框的datalist
    };

    const saveDeletedDishes = () => {
        localStorage.setItem("family_deleted_dishes_v3", JSON.stringify(deletedDishIds));
        rebuildDishLibrary();
        renderDishLibrary();
        renderCategoryFilter();
        renderCurrentDayPlan();
    };

    const saveSubtitle = (newSubtitle) => {
        customSubtitle = newSubtitle;
        localStorage.setItem("family_custom_subtitle", customSubtitle);
        const subtitleDiv = document.getElementById("customSubtitle");
        if (subtitleDiv) subtitleDiv.textContent = customSubtitle;
    };

    // 删除菜品（预设和自定义都支持）
    const deleteDish = (id, name) => {
        if (confirm(`确定删除「${name}」吗？删除后将无法恢复`)) {
            const isDefault = DEFAULT_DISHES.some(d => d.id === id);
            if (isDefault) {
                if (!deletedDishIds.includes(id)) {
                    deletedDishIds.push(id);
                    saveDeletedDishes();
                    showToast(`🗑️ 已删除预设菜品「${name}」`);
                }
            } else {
                customDishes = customDishes.filter(d => d.id !== id);
                saveCustomDishes();
                showToast(`🗑️ 已删除自定义菜品「${name}」`);
            }
        }
    };

    // 添加菜品到某餐（支持自动创建新菜）
    const addDishToMeal = (day, mealKey, dishName) => {
        if (!dishName || dishName.trim() === "") return;
        dishName = dishName.trim();
        
        // 检查菜品库中是否存在该菜名
        const existing = dishLibrary.find(d => d.name === dishName);
        if (!existing) {
            // 不存在，自动添加到菜品库（默认分类为“家常菜”，可让用户选择）
            const newCategory = prompt(`「${dishName}」不在菜品库中，请选择分类：\n早餐 / 家常菜 / 素菜 / 硬菜 / 汤类 / 主食 / 海鲜 / 凉菜 / 饮品`, "家常菜");
            if (!newCategory) return;
            const newId = "c_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
            customDishes.push({
                id: newId,
                name: dishName,
                category: newCategory,
                emoji: "🍲"
            });
            saveCustomDishes();
            showToast(`✨ 新菜「${dishName}」已加入菜品库`);
        }
        
        if (!mealPlan[day]) mealPlan[day] = { breakfast: [], lunch: [], dinner: [] };
        if (!mealPlan[day][mealKey]) mealPlan[day][mealKey] = [];
        if (!mealPlan[day][mealKey].includes(dishName)) {
            mealPlan[day][mealKey].push(dishName);
            savePlan();
            renderCurrentDayPlan();
            showToast(`✅ 已添加「${dishName}」到 ${day} ${getMealLabel(mealKey)}`);
        } else {
            showToast(`⚠️ 「${dishName}」已存在，无需重复添加`);
        }
    };

    const removeDishFromMeal = (day, mealKey, dishName) => {
        if (mealPlan[day] && mealPlan[day][mealKey]) {
            mealPlan[day][mealKey] = mealPlan[day][mealKey].filter(d => d !== dishName);
            savePlan();
            renderCurrentDayPlan();
            showToast(`🗑️ 已移除「${dishName}」`);
        }
    };

    const getMealLabel = (mealKey) => {
        const meal = MEALS.find(m => m.key === mealKey);
        return meal ? meal.label : mealKey;
    };

    // 添加自定义菜品（传统方式）
    const addCustomDish = () => {
        let name = prompt("输入新菜品名称", "");
        if (!name || name.trim() === "") return;
        name = name.trim();
        let category = prompt("选择分类 (早餐/家常菜/素菜/硬菜/汤类/主食/海鲜/凉菜/饮品)", "家常菜");
        if (!category) category = "家常菜";
        const newId = "c_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        customDishes.push({
            id: newId,
            name: name,
            category: category,
            emoji: "🍲"
        });
        saveCustomDishes();
        showToast(`➕ 已添加「${name}」到菜品库`);
    };

    // 渲染当前日期的三餐（使用输入框+搜索建议）
    const renderCurrentDayPlan = () => {
        const day = WEEKDAYS[currentDayIndex];
        const dayPlan = mealPlan[day] || { breakfast: [], lunch: [], dinner: [] };
        const container = document.getElementById("mealPlanContainer");
        if (!container) return;

        // 生成菜品列表用于 datalist
        const allDishNames = [...new Set(dishLibrary.map(d => d.name))].sort();
        const datalistId = "dishSuggestions";

        container.innerHTML = `
            <datalist id="${datalistId}">
                ${allDishNames.map(name => `<option value="${name.replace(/"/g, '&quot;')}">`).join('')}
            </datalist>
            <div style="margin-bottom: 12px; font-size: 0.9rem; color: #6b8c5c;">
                <i class="fas fa-calendar-day"></i> 正在编辑：<strong>${day}</strong>
            </div>
            ${MEALS.map(meal => {
                const dishes = dayPlan[meal.key] || [];
                return `
                    <div class="meal-card">
                        <div class="meal-header">
                            <div class="meal-header-left">
                                <i class="fas ${meal.icon}"></i> ${meal.label}
                            </div>
                            <div class="dish-input-container">
                                <input type="text" class="dish-search-input" list="${datalistId}" 
                                       placeholder="输入菜名（支持搜索）" id="dishInput_${meal.key}">
                                <button class="add-dish-btn" data-meal="${meal.key}" data-day="${day}">
                                    <i class="fas fa-plus"></i> 添加
                                </button>
                            </div>
                        </div>
                        <div class="meal-content">
                            <div class="dishes-list" data-meal="${meal.key}" data-day="${day}">
                                ${dishes.length === 0 ? '<span class="empty-meal">暂未选择菜品，输入菜名后点击添加</span>' : 
                                    dishes.map(dish => `
                                        <span class="dish-tag">
                                            ${dish}
                                            <button class="remove-dish" data-dish="${dish.replace(/"/g, '&quot;')}">
                                                <i class="fas fa-times-circle"></i>
                                            </button>
                                        </span>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}
        `;

        // 绑定添加按钮事件
        document.querySelectorAll('.add-dish-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mealKey = btn.getAttribute('data-meal');
                const day = btn.getAttribute('data-day');
                const input = document.getElementById(`dishInput_${mealKey}`);
                const dishName = input.value.trim();
                if (dishName) {
                    addDishToMeal(day, mealKey, dishName);
                    input.value = ""; // 清空输入框
                } else {
                    showToast("请输入菜品名称");
                }
            });
        });

        // 绑定输入框回车事件
        document.querySelectorAll('.dish-search-input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const mealKey = input.id.split('_')[1];
                    const btn = document.querySelector(`.add-dish-btn[data-meal="${mealKey}"]`);
                    if (btn) btn.click();
                }
            });
        });

        // 绑定删除菜品事件
        document.querySelectorAll('.remove-dish').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const dishName = btn.getAttribute('data-dish');
                const day = btn.closest('.dishes-list')?.getAttribute('data-day');
                const mealKey = btn.closest('.dishes-list')?.getAttribute('data-meal');
                if (day && mealKey && dishName) {
                    removeDishFromMeal(day, mealKey, dishName);
                }
            });
        });
    };

    // 渲染星期选项卡
    const renderWeekTabs = () => {
        const todayIndex = getCurrentWeekdayIndex();
        const container = document.getElementById("weekTabs");
        if (!container) return;
        container.innerHTML = WEEKDAYS.map((day, idx) => `
            <button class="day-tab ${currentDayIndex === idx ? 'active' : ''} ${todayIndex === idx ? 'today' : ''}" data-dayidx="${idx}">
                ${day} ${todayIndex === idx ? '(今天)' : ''}
            </button>
        `).join('');
        document.querySelectorAll('.day-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-dayidx'));
                if (!isNaN(idx)) {
                    currentDayIndex = idx;
                    renderWeekTabs();
                    renderCurrentDayPlan();
                }
            });
        });
    };

    // 渲染菜品库
    const renderDishLibrary = () => {
        let filtered = [...dishLibrary];
        if (currentCategoryFilter !== "全部") {
            filtered = filtered.filter(d => d.category === currentCategoryFilter);
        }
        const container = document.getElementById("dishList");
        if (!container) return;
        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#b0c4a2;">暂无菜品，点「自定义菜」添加</div>`;
            return;
        }
        container.innerHTML = filtered.map(dish => {
            return `
                <div class="dish-item">
                    <div class="dish-name">
                        <span>${dish.emoji || '🍽️'} ${dish.name}</span>
                        <span class="dish-category-badge">${dish.category}</span>
                    </div>
                    <div class="dish-actions">
                        <button class="delete-dish-btn" data-dishid="${dish.id}" data-dishname="${dish.name.replace(/"/g, '&quot;')}">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.delete-dish-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-dishid');
                const name = btn.getAttribute('data-dishname');
                if (id) deleteDish(id, name);
            });
        });
    };

    // 渲染分类筛选
    const renderCategoryFilter = () => {
        const categories = ["全部", ...new Set(dishLibrary.map(d => d.category))];
        const container = document.getElementById("categoryFilter");
        if (!container) return;
        container.innerHTML = categories.map(cat => `
            <button class="cat-filter-btn ${currentCategoryFilter === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>
        `).join('');
        document.querySelectorAll('.cat-filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentCategoryFilter = btn.getAttribute('data-cat');
                renderCategoryFilter();
                renderDishLibrary();
            });
        });
    };

    // 导出数据
    const exportData = () => {
        const data = {
            plan: mealPlan,
            custom: customDishes,
            deleted: deletedDishIds,
            subtitle: customSubtitle
        };
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `家庭菜单计划_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("📁 数据已导出，请发送给另一半");
    };

    // 导入数据
    const importData = () => {
        const fileInput = document.getElementById("importFileInput");
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.plan && data.custom !== undefined && data.deleted !== undefined) {
                        mealPlan = data.plan;
                        customDishes = data.custom;
                        deletedDishIds = data.deleted;
                        if (data.subtitle) saveSubtitle(data.subtitle);
                        savePlan();
                        saveCustomDishes();
                        saveDeletedDishes();
                        renderWeekTabs();
                        renderCurrentDayPlan();
                        renderCategoryFilter();
                        renderDishLibrary();
                        showToast("✅ 导入成功！菜单已同步");
                    } else {
                        showToast("❌ 文件格式不正确");
                    }
                } catch (err) {
                    showToast("❌ 解析失败");
                }
                fileInput.value = "";
            };
            reader.readAsText(file);
        };
        fileInput.click();
    };

    // 分享链接（需部署后使用）
    const shareLink = () => {
        const url = window.location.href.split('?')[0];
        if (url.startsWith('file://')) {
            showToast("⚠️ 当前为本地文件，无法生成分享链接。请先部署到线上");
        } else {
            navigator.clipboard.writeText(url).then(() => {
                showToast("📋 链接已复制！发送给另一半，对方打开即可共同编辑");
            }).catch(() => {
                prompt("手动复制链接:", url);
            });
        }
    };

    const copyToWeek = () => {
        const sourceDay = WEEKDAYS[currentDayIndex];
        const sourcePlan = JSON.parse(JSON.stringify(mealPlan[sourceDay]));
        if (confirm(`将「${sourceDay}」的三餐计划复制到本周其他日子吗？`)) {
            for (let i = 0; i < WEEKDAYS.length; i++) {
                const targetDay = WEEKDAYS[i];
                if (targetDay !== sourceDay) {
                    mealPlan[targetDay] = JSON.parse(JSON.stringify(sourcePlan));
                }
            }
            savePlan();
            renderCurrentDayPlan();
            showToast("📋 已复制到本周其他日子");
        }
    };

    const resetToday = () => {
        const day = WEEKDAYS[currentDayIndex];
        if (confirm(`重置「${day}」所有餐单？`)) {
            mealPlan[day] = { breakfast: [], lunch: [], dinner: [] };
            savePlan();
            renderCurrentDayPlan();
            showToast(`🔄 已重置 ${day} 的饮食计划`);
        }
    };

    const showToast = (msg, duration = 2000) => {
        const toast = document.getElementById("toastMsg");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), duration);
    };

    // 初始化
    const init = () => {
        loadData();
        currentDayIndex = getCurrentWeekdayIndex();
        renderWeekTabs();
        renderCurrentDayPlan();
        renderCategoryFilter();
        renderDishLibrary();
        
        // 自定义副标题编辑
        const subtitleDiv = document.getElementById("customSubtitle");
        subtitleDiv.addEventListener("click", () => {
            const newText = prompt("请输入自定义文案：", customSubtitle);
            if (newText !== null && newText.trim() !== "") {
                saveSubtitle(newText.trim());
            }
        });
        
        document.getElementById("exportDataBtn")?.addEventListener("click", exportData);
        document.getElementById("importDataBtn")?.addEventListener("click", importData);
        document.getElementById("sharePlanBtn")?.addEventListener("click", shareLink);
        document.getElementById("copyWeekBtn")?.addEventListener("click", copyToWeek);
        document.getElementById("resetDayBtn")?.addEventListener("click", resetToday);
        document.getElementById("addCustomDishBtn")?.addEventListener("click", addCustomDish);
    };

    init();
</script>
</body>
</html>
